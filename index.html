<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcf9ff">
<title>小心愿 · 把成长装进星星罐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#504466;--muted:#9188a0;--lav:#eee6fb;--violet:#9875dc;--pink:#ffdce7;--yellow:#ffcc65;--green:#69bfa4;--bg:#fcf8ff;--border:#eee7f1}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,#ffe7f1,transparent 30%),radial-gradient(circle at 88% 22%,#e8e2ff,transparent 33%),#fcf9ff;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:1140px;margin:auto;padding:24px 30px 58px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.logo{font-size:26px;font-weight:900;color:#8c6cd3;letter-spacing:1px}
.logo span{font-size:17px;font-weight:700;color:#ad98c9;display:block;letter-spacing:0}
.tools{display:flex;align-items:center;gap:10px}
.miniBtn{border:1px solid #e8dff2;background:#fff;border-radius:17px;padding:12px 16px;color:#715c91;font-weight:800;box-shadow:0 4px 12px #8b74ac0a}
.miniBtn:hover{border-color:#cbb7e9}
.shell{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:20px;align-items:start}
.panel{background:#fffdfef2;border:1px solid #f1eafa;border-radius:30px;box-shadow:0 12px 35px #75639612;padding:24px}
.hero{text-align:center;position:relative;overflow:hidden;min-height:550px;background:radial-gradient(circle at 48% 37%,#fff7de,transparent 53%),linear-gradient(145deg,#fff6fa,#f4efff)}
.twinkle{position:absolute;color:#f6bb56;font-size:23px;animation:blink 3s ease-in-out infinite}
.t1{top:80px;left:16%}.t2{top:154px;right:12%;animation-delay:1s}.t3{top:260px;left:10%;animation-delay:2s}
.eyebrow{font-weight:800;color:#aa8bc7;font-size:15px}
.hero h1{font-size:25px;margin:8px 0 0;font-weight:900}
.sub{font-size:14px;color:#a493b8;margin:6px 0 8px}
.jarWrap{position:relative;width:285px;height:290px;margin:0 auto 0}
.jarWrap.bounce{animation:jarBounce .6s ease}
.jarWrap.shake{animation:jarShake .5s ease}
.jarSvg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 15px 14px #ad8d8c2d)}
.starInside{transform-origin:center;animation:pop .65s both}
.balance{font-weight:900;font-size:54px;color:#8063be;line-height:1.1;margin-top:-5px}
.unit{font-size:16px;color:#a18bbb;font-weight:800}
.quote{font-size:13px;color:#9c86ad;margin:8px 0 22px}
.actions{display:flex;gap:12px;margin:0 auto;max-width:400px}
.action{border:none;padding:17px 10px;border-radius:19px;flex:1;font-weight:900;font-size:17px;transition:transform .2s;box-shadow:0 8px 0 #00000009}
.action:hover{transform:translateY(-3px)}
.earn{color:#327c69;background:#c9f3dd}
.spend{color:#9c6087;background:#ffdfed}
.right{display:flex;flex-direction:column;gap:18px}
.sectionTitle{font-size:21px;font-weight:900}
.monthhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.monthCtrl{display:flex;align-items:center;gap:12px}
.circleBtn{border:0;background:#f4effb;color:#8b70bd;width:32px;height:32px;border-radius:12px;font-size:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{border-radius:18px;padding:13px 16px;background:#f0fcf4}
.stat.spendStat{background:#fff1f6}
.stat small{display:block;color:#8b9c92;font-weight:700;font-size:12px}
.stat.spendStat small{color:#b394a3}
.stat strong{font-size:25px;color:#54ab89}
.stat.spendStat strong{color:#e392ac}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekday{text-align:center;font-size:12px;color:#ae9eb5;font-weight:800;padding:4px 0 9px}
.day{position:relative;aspect-ratio:1/1;border:0;border-radius:12px;background:transparent;color:#695b77;font-weight:800;min-width:0;font-size:13px}
.day.current{background:#f3eafa;color:#7f61bd}
.day.selected{background:#a689df;color:#fff}
.day.empty{pointer-events:none}
.dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.dot{width:4px;height:4px;border-radius:50%;background:#5cb894}
.dot.down{background:#f2a35e}
.day.selected .dot{background:white}
.dayRecords{border-top:1px dashed #e8dfee;margin-top:16px;padding-top:15px}
.recordsHead{font-size:14px;font-weight:900;margin-bottom:8px}
.rec{display:flex;align-items:center;justify-content:space-between;padding:11px 1px;border-bottom:1px solid #f5f0f8;gap:10px}
.rec:last-child{border:0}
.recName{font-weight:800;font-size:14px}
.recMeta{font-size:11px;color:#aa9bad;margin-top:4px}
.amount{font-weight:900;font-size:18px;color:#56b18b}
.amount.negative{color:#e18dab}
.emptyText{color:#b3a5bf;text-align:center;padding:22px;font-size:13px}
.footerNav{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:18px}
.footerNav button{background:#fff;border:1px solid #ebdef7;color:#8e74bd;padding:12px 22px;border-radius:16px;font-weight:900}
.footerNote{text-align:center;color:#b0a3bd;font-size:12px;margin-top:16px}
.overlay{position:fixed;inset:0;background:#3b2b59a1;z-index:20;display:flex;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(5px)}
.modal{position:relative;background:#fffdfd;border-radius:30px;padding:28px;width:min(100%,490px);max-height:90dvh;overflow-y:auto;box-shadow:0 25px 85px #37224f40;animation:rise .28s ease}
.modal.wide{width:min(100%,700px)}
.modal h2{font-size:23px;margin:0 0 8px;font-weight:900}
.modal p{line-height:1.85;color:#80738f;font-size:14px}
.x{border:0;background:#f3edf8;color:#9e8db6;position:absolute;right:20px;top:18px;border-radius:12px;width:33px;height:33px;font-size:20px}
.primary{border:0;border-radius:16px;background:#9c7bdc;color:white;font-weight:900;padding:14px 18px;box-shadow:0 6px 15px #9875dc32}
.primary.full{width:100%}
.secondary{border:1px solid #e8ddf4;background:#fff;color:#9b7cc8;border-radius:15px;font-weight:800;padding:13px 17px}
.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}
.field label{font-weight:800;font-size:14px}
.field input{border:1px solid #e6dcf0;border-radius:13px;padding:13px;outline:none;color:#514362;background:#fff}
.field input:focus{border-color:#9e7de0;box-shadow:0 0 0 3px #9e7de020}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.tabs{display:flex;background:#f4eff9;border-radius:14px;padding:5px;gap:4px;margin:16px 0}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;color:#a08eb3;font-weight:900}
.tabs button.on{background:#fff;color:#8a67ce;box-shadow:0 3px 11px #66508012}
.quickTags{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 18px}
.quickTag{border:1px solid #e5d7f4;background:#f9f3ff;border-radius:999px;padding:10px 14px;color:#8566b4;font-weight:800;font-size:13px}
.quickTag:hover,.quickTag:focus-visible{background:#eee3ff;border-color:#a78adc}
.quickTag.sel{background:#eee3ff;border-color:#a78adc}
.quickTag:active{transform:scale(.97)}
.row{display:flex;gap:9px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.settingItem{display:flex;align-items:center;gap:8px;background:#faf7fd;border-radius:14px;padding:10px;margin:8px 0}
.settingItem input{border:1px solid #e9e1f0;background:white;border-radius:9px;padding:10px;outline:none;min-width:0}
.settingItem input.num{width:70px;flex:0 0 auto}
.settingItem .sign{font-weight:900;color:#a17ecf}
.delete{border:none;color:#cf8a9f;background:#fff0f5;border-radius:9px;padding:9px;flex:0 0 auto}
.badge{background:#f3ecff;border-radius:30px;padding:6px 10px;color:#9874ce;font-size:12px;font-weight:900}
.hint{font-size:12px;color:#a79ab2;line-height:1.7}
.error{font-size:12px;color:#cd687a;min-height:17px}
.ledgerList{max-height:390px;overflow:auto}
.ledgerPage{max-width:780px;margin:0 auto;min-height:65vh}
.ledgerPageHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ledgerPage .ledgerList{max-height:none;overflow:visible}
.ledgerPage .rec{padding:18px 4px}
.ledgerPage .recName{font-size:16px}
.ledgerPage .recMeta{font-size:13px}
.childChoice{width:100%;text-align:left;background:#faf6fe;border:1px solid #ede0fa;border-radius:14px;margin:6px 0;padding:14px;color:#735f8d;font-weight:800}
.childChoice.active{border-color:#a98ade;background:#eee5fd}
.childBal{float:right;font-weight:800;color:#a17ecf}
.bigEmoji{font-size:48px;text-align:center;margin:4px 0 10px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#58456f;color:#fff;padding:12px 19px;border-radius:13px;z-index:50;box-shadow:0 8px 35px #54406740;font-weight:800;font-size:13px;animation:rise .25s;max-width:86vw;text-align:center}
.confetti{pointer-events:none;position:fixed;left:50%;top:43%;z-index:40;font-size:26px;animation:scatter 1s forwards}
.flyStar{position:fixed;left:0;top:0;z-index:45;font-size:20px;pointer-events:none;opacity:1;transition:transform .7s cubic-bezier(.45,-.15,.55,1),opacity .75s ease;will-change:transform}
.introPoints{background:#fbf5ff;padding:14px 18px;border-radius:18px;color:#8c77a6;font-size:14px;line-height:2}
.none{display:none!important}
@keyframes blink{50%{opacity:.3;transform:scale(.7)}}
@keyframes pop{from{transform:scale(.15) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes scatter{to{transform:translate(var(--tx),var(--ty)) rotate(160deg);opacity:0}}
@keyframes jarBounce{0%{transform:scale(1)}30%{transform:scale(1.06,.94)}55%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@keyframes jarShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
@media(max-width:800px){
.app{padding:16px 15px 40px}
.shell{grid-template-columns:1fr}
.top{margin-bottom:15px}
.logo{font-size:23px}.logo span{font-size:11px}
.panel{padding:18px;border-radius:24px}
.hero{min-height:515px}
.jarWrap{width:255px;height:265px}
.modal{padding:23px}
.tools{gap:6px}
.miniBtn{padding:10px;font-size:13px}
.footerNav button{flex:1}
}
@media(max-width:550px){
.overlay.sheet{align-items:flex-end;padding:0}
.overlay.sheet .modal{width:100%;border-radius:27px 27px 0 0;max-height:92dvh;padding-bottom:max(25px,env(safe-area-inset-bottom))}
.action{font-size:15px}
.hero h1{font-size:22px}
.balance{font-size:47px}
.field input,.settingItem input{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">✦ 小心愿 <span>把成长装进星星罐</span></div>
    <div class="tools">
      <button class="miniBtn" id="switchChild">👧 <span id="childLabel">我的宝贝</span> ⌄</button>
      <button class="miniBtn" id="settingsBtn" aria-label="设置">⚙️</button>
    </div>
  </header>

  <div class="shell">
    <section class="panel hero">
      <span class="twinkle t1">✧</span><span class="twinkle t2">✦</span><span class="twinkle t3">✧</span>
      <div class="eyebrow">✦ 每天积攒一点点 ✦</div>
      <h1 id="jarTitle">我的星愿储蓄罐</h1>
      <p class="sub">每一颗星星，都代表一次成长</p>
      <div class="jarWrap" id="jarWrap">
        <svg id="jar" viewBox="0 0 300 320" class="jarSvg" aria-label="可视化星愿储蓄罐">
          <defs>
            <linearGradient id="jarGlass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffefa" stop-opacity=".85"/>
              <stop offset=".6" stop-color="#ffdfde" stop-opacity=".53"/>
              <stop offset="1" stop-color="#e2c8ff" stop-opacity=".60"/>
            </linearGradient>
            <clipPath id="clipJar"><rect x="65" y="70" width="170" height="224" rx="58"/></clipPath>
          </defs>
          <ellipse cx="150" cy="297" rx="95" ry="13" fill="#c6b0ce" opacity=".19"/>
          <rect x="65" y="70" width="170" height="224" rx="58" fill="url(#jarGlass)" stroke="#d5acc2" stroke-width="4"/>
          <g clip-path="url(#clipJar)" id="starGroup"></g>
          <path d="M85 98Q73 149 89 226" fill="none" stroke="white" stroke-width="12" opacity=".65" stroke-linecap="round"/>
          <rect x="94" y="48" width="112" height="35" rx="13" fill="#e0acc5" stroke="#d39eb8" stroke-width="3"/>
          <rect x="104" y="35" width="92" height="25" rx="12" fill="#ffe1d9" stroke="#eab9c7" stroke-width="3"/>
          <ellipse cx="150" cy="80" rx="41" ry="7" fill="#c687ac" opacity=".25"/>
          <path d="M125 113Q147 128 169 113" stroke="#d4adc3" fill="none" stroke-width="2" opacity=".4"/>
        </svg>
      </div>
      <div class="balance" id="balance">0</div>
      <div class="unit" id="coinLabel">星愿币</div>
      <div class="quote">努力会发光，心愿慢慢长大 ♡</div>
      <div class="actions">
        <button class="action earn" id="addBtn">✦ &nbsp;获得星愿币</button>
        <button class="action spend" id="useBtn">♡ &nbsp;使用星愿币</button>
      </div>
    </section>

    <aside class="right">
      <section class="panel">
        <div class="monthhead">
          <div class="sectionTitle">🗓️ 成长日历</div>
          <div class="monthCtrl">
            <button class="circleBtn" id="prevMonth" aria-label="上个月">‹</button>
            <strong id="monthTitle"></strong>
            <button class="circleBtn" id="nextMonth" aria-label="下个月">›</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><small>本月获得</small><strong id="monthAdd">+0</strong></div>
          <div class="stat spendStat"><small>本月使用</small><strong id="monthUse">-0</strong></div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="dayRecords">
          <div class="recordsHead" id="dayTitle"></div>
          <div id="dayList"></div>
        </div>
      </section>
      <section class="panel">
        <div class="sectionTitle" style="font-size:17px">🌷 小心愿小贴士</div>
        <p style="font-size:13px;color:#9587a6;line-height:1.8;margin:8px 0 0">比起一次拿到很多星星，更珍贵的是每天都有一点进步。试着和孩子一起庆祝今天的努力吧！</p>
      </section>
    </aside>
  </div>

  <section id="ledgerPage" class="ledgerPage none" aria-label="心愿明细记录">
    <div class="ledgerPageHead">
      <button class="miniBtn" id="backHome">← 返回首页</button>
      <span class="badge">✨ 成长足迹</span>
    </div>
    <div class="panel">
      <h1 style="margin:0 0 8px;font-size:27px">📖 心愿明细记录</h1>
      <p id="ledgerSubtitle" class="hint" style="font-size:14px">每一份努力，都值得被记录。</p>
      <div class="tabs">
        <button data-ledger="earn" class="on">🌟 获得记录</button>
        <button data-ledger="spend">🎁 使用记录</button>
      </div>
      <div class="ledgerList" id="ledgerList"></div>
      <div id="loadMoreWrap" class="none" style="text-align:center;margin-top:14px">
        <button class="secondary" id="loadMore">加载更多 ↓</button>
      </div>
      <p class="hint" style="margin-top:20px">记录有误？可回到首页，通过增加或使用心愿币进行手动调整。</p>
    </div>
  </section>

  <nav class="footerNav">
    <button id="ledgerBtn">📖 明细记录</button>
    <button id="helpBtn">💌 使用说明</button>
  </nav>
  <div class="footerNote">小心愿 · 让每一次小小付出，都被温柔看见 ✨<br>单文件体验版 · 数据仅保存在当前浏览器中</div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(()=>{'use strict';
/* ================= 基础工具 ================= */
const KEY='xiaoxinyuan_mvp_v1';
const BACKUP_KEY='xiaoxinyuan_mvp_backup_v1';
const MAX_AMOUNT=999999;
const PAGE_SIZE=20;
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ================= 数据层 ================= */
const defaultQuickItems=()=>[
  {type:'earn',name:'洗碗筷',amount:5},
  {type:'earn',name:'拖地',amount:5},
  {type:'spend',name:'零食',amount:3},
  {type:'spend',name:'看电视',amount:5}
];
const freshState=()=>({schemaVersion:1,currentChildId:null,onboarded:false,children:[]});
let storageWarning=null;

function clampAmount(v){v=Math.floor(Number(v));return Number.isFinite(v)&&v>0?Math.min(v,MAX_AMOUNT):0}
function recalcBalance(c){c.balance=c.transactions.reduce((s,t)=>s+(t.type==='earn'?t.amount:-t.amount),0)}
function normalizeChild(c){
  c.id=String(c.id);
  c.name=String(c.name).trim().slice(0,12)||'宝贝';
  c.currencyName=(typeof c.currencyName==='string'&&c.currencyName.trim())?c.currencyName.trim().slice(0,8):'星愿币';
  c.quickItems=(Array.isArray(c.quickItems)?c.quickItems:[])
    .filter(q=>q&&typeof q==='object'&&(q.type==='earn'||q.type==='spend')&&typeof q.name==='string'&&q.name.trim()&&clampAmount(q.amount)>0)
    .map((q,i)=>({id:String(q.id||uid()),childId:c.id,type:q.type,name:q.name.trim().slice(0,20),amount:clampAmount(q.amount),sortOrder:Number.isInteger(q.sortOrder)?q.sortOrder:i,createdAt:Number(q.createdAt)||Date.now()}));
  c.transactions=(Array.isArray(c.transactions)?c.transactions:[])
    .filter(t=>t&&typeof t==='object'&&(t.type==='earn'||t.type==='spend')&&clampAmount(t.amount)>0)
    .map(t=>({id:String(t.id||uid()),childId:c.id,type:t.type,amount:clampAmount(t.amount),reason:String(t.reason??'').slice(0,100),operator:String(t.operator||'家长').slice(0,20),createdAt:Number(t.createdAt)||Date.now()}));
  recalcBalance(c);
  c.createdAt=Number(c.createdAt)||Date.now();
  c.updatedAt=Number(c.updatedAt)||Date.now();
  return c;
}
function loadState(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}
  catch(e){storageWarning='无法读取本地数据，请检查浏览器存储权限';return freshState()}
  let s=null;
  if(raw){try{s=JSON.parse(raw)}catch(e){s=null}}
  if(!s||typeof s!=='object'||!Array.isArray(s.children)){
    if(raw){try{localStorage.setItem(BACKUP_KEY,raw)}catch(e){}storageWarning='检测到本地数据异常，原数据已备份，本次已重置'}
    s=freshState();
  }
  s.schemaVersion=1;
  s.onboarded=!!s.onboarded;
  s.children=s.children.filter(c=>c&&typeof c==='object'&&c.id).map(normalizeChild);
  if(!s.children.some(c=>c.id===s.currentChildId))s.currentChildId=s.children[0]?s.children[0].id:null;
  return s;
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}
  catch(e){toast('数据保存失败，请检查浏览器存储权限或空间');return false}
}
let state=loadState();
function child(){return state.children.find(c=>c.id===state.currentChildId)||state.children[0]||null}

/* ================= 日期工具 ================= */
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function fmtDateTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

/* ================= 视图状态 ================= */

const closeBtn=()=>'<button class="x" data-close aria-label="关闭">×</button>';

function bindFocusScroll(ids){ids.forEach(id=>{const el=$(id);if(el)el.addEventListener('focus',()=>setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),250))})}

/* ================= 动画 ================= */
function animateNumber(el,to){
  const from=Number(el.dataset.v||'0')||0;
  el.dataset.v=String(to);
  if(reducedMotion||from===to){el.textContent=to.toLocaleString('zh-CN');return}
  const t0=performance.now(),dur=650;
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e).toLocaleString('zh-CN');
    if(k<1)requestAnimationFrame(step);else el.textContent=to.toLocaleString('zh-CN');
  };
  requestAnimationFrame(step);
}
function replayClass(el,cls){if(reducedMotion)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function flyStarsToJar(){
  if(reducedMotion)return;
  const btn=$('addBtn'),wrap=$('jarWrap');
  if(!btn||!wrap)return;
  const b=btn.getBoundingClientRect(),j=wrap.getBoundingClientRect();
  const sx=b.left+b.width/2,sy=b.top+b.height/2;
  const jx=j.left+j.width/2,jy=j.top+j.height*.55;
  for(let i=0;i<7;i++){
    const e=document.createElement('span');
    e.className='flyStar';e.textContent=i%2?'⭐':'✦';
    e.style.left=sx+'px';e.style.top=sy+'px';
    document.body.appendChild(e);
    const dx=jx-sx+(Math.random()-.5)*46,dy=jy-sy+(Math.random()-.5)*30;
    setTimeout(()=>{e.style.transform=`translate(${dx}px,${dy}px) scale(.55) rotate(${Math.round(Math.random()*120-60)}deg)`;e.style.opacity='.9'},30+i*55);
    setTimeout(()=>e.remove(),980+i*55);
  }
}
function burst(){
  for(let i=0;i<16;i++){
    const e=document.createElement('span');
    e.className='confetti';e.textContent=i%3?'⭐':'✨';
    e.style.setProperty('--tx',Math.round((Math.random()-.5)*380)+'px');
    e.style.setProperty('--ty',Math.round((Math.random()-.5)*390)+'px');
    e.style.left=(40+Math.random()*20)+'%';
    document.body.append(e);
    setTimeout(()=>e.remove(),1100);
  }
}

/* ================= 星星罐 ================= */
function starPath(x,y,r,rot){
  const pts=[];
  for(let i=0;i<10;i++){
    const a=(i*36-90+rot)*Math.PI/180,rad=i%2?r*.48:r;
    pts.push((x+Math.cos(a)*rad).toFixed(1)+','+(y+Math.sin(a)*rad).toFixed(1));
  }
  return pts.join(' ');
}
function renderJar(){
  const c=child();if(!c)return;
  const g=$('starGroup');
  const bal=Math.max(0,c.balance);
  const n=Math.min(42,Math.ceil(Math.sqrt(bal)*3));
  let html='';
  for(let i=0;i<n;i++){
    const col=i%7,row=Math.floor(i/7);
    const x=94+col*18+(row%2)*7,y=265-row*25+(i%3)*3,r=8+(i%3)*2;
    if(y<95)continue;
    html+=`<polygon class="starInside" style="animation-delay:${Math.min(i*22,480)}ms" points="${starPath(x,y,r,i*23)}" fill="${['#ffd36c','#ffc5ad','#d5b2f5','#ffe593'][i%4]}" stroke="#edc88d" stroke-width=".7"/>`;
  }
  g.innerHTML=html;
}

/* ================= 渲染 ================= */
function render(){
  const c=child();if(!c)return;
  $('childLabel').textContent=c.name;
  $('jarTitle').textContent=c.name+'的星愿储蓄罐';
  animateNumber($('balance'),Math.max(0,c.balance));
  $('coinLabel').textContent=c.currencyName;
  renderJar();
  renderCalendar();
  if(isLedgerView())drawLedger();
}
function recHTML(t){
  return `<div class="rec"><div class="grow"><div class="recName">${escapeHTML(t.reason)}</div><div class="recMeta">${fmtDateTime(t.createdAt)} · ${escapeHTML(t.operator||'家长')}</div></div><strong class="amount ${t.type==='spend'?'negative':''}">${t.type==='earn'?'+':'-'}${t.amount}</strong></div>`;
}
function renderCalendar(){
  const c=child();if(!c)return;
  $('monthTitle').textContent=viewYear+' 年 '+(viewMonth+1)+' 月';
  const t=new Date(),tk=todayKey();
  const isCurMonth=viewYear===t.getFullYear()&&viewMonth===t.getMonth();
  const monthRecs=c.transactions.filter(x=>{const d=new Date(x.createdAt);return d.getFullYear()===viewYear&&d.getMonth()===viewMonth});
  $('monthAdd').textContent='+'+monthRecs.filter(x=>x.type==='earn').reduce((s,x)=>s+x.amount,0);
  $('monthUse').textContent='-'+monthRecs.filter(x=>x.type==='spend').reduce((s,x)=>s+x.amount,0);
  const first=(new Date(viewYear,viewMonth,1).getDay()+6)%7,days=new Date(viewYear,viewMonth+1,0).getDate();
  let html=['一','二','三','四','五','六','日'].map(w=>`<div class="weekday">${w}</div>`).join('');
  for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=dateKey(new Date(viewYear,viewMonth,d));
    const recs=c.transactions.filter(x=>dateKey(new Date(x.createdAt))===k);
    const hasE=recs.some(x=>x.type==='earn'),hasS=recs.some(x=>x.type==='spend');
    html+=`<button class="day ${k===selectedDate?'selected':''} ${k===tk?'current':''}" data-day="${k}" aria-label="${k}">${d}<div class="dots">${hasE?'<span class="dot"></span>':''}${hasS?'<span class="dot down"></span>':''}</div></button>`;
  }
  $('calendar').innerHTML=html;
  $('calendar').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;renderCalendar()});
  const parts=selectedDate.split('-');
  $('dayTitle').textContent=Number(parts[1])+'月'+Number(parts[2])+'日 · 心愿记录';
  const list=c.transactions.filter(x=>dateKey(new Date(x.createdAt))===selectedDate).sort((a,b)=>b.createdAt-a.createdAt);
  if(list.length){$('dayList').innerHTML=list.map(recHTML).join('')}
  else{
    $('dayList').innerHTML='<div class="emptyText">这一天还没有心愿记录 ✨'+(selectedDate>tk?'<br><span style="font-size:12px">未来的日期可以查看，但不能提前记账哦</span>':'')+'</div>';
  }
}

let tempItems=[],presetTab='earn';

  const src=(sourceItems&&sourceItems.length?sourceItems:defaultQuickItems());
  tempItems={
    earn:src.filter(q=>q.type==='earn').map(q=>({name:q.name,amount:q.amount})),
    spend:src.filter(q=>q.type==='spend').map(q=>({name:q.name,amount:q.amount}))

}
function presetRow(p,tab,i){

}
function renderPresetModal(mode){
  const firstRun=mode==='first',manage=mode==='manage';
  showModal(`${manage||mode==='add'?closeBtn():''}
    <h2>⚡ ${firstRun?'设置常用项目':manage?'管理快捷项目':'设置快捷项目'}</h2>
    <p>预先设置常用项目，以后记一笔只需轻轻一点，随时可以调整。</p>
    <div class="tabs">
      <button data-st="earn" class="${presetTab==='earn'?'on':''}">✦ 获得心愿币</button>

    </div>
    <div id="items"></div>
    <button class="secondary" id="addPreset">＋ 添加项目</button>
    <div class="error" id="pErr"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary grow" id="savePreset">${manage?'保存设置':'保存并开始 ✨'}</button>
      ${manage?'':'<button class="secondary" id="skipPreset">跳过</button>'}
    </div>`,

    document.querySelectorAll('.editName').forEach(el=>{tempItems[el.dataset.type][+el.dataset.idx].name=el.value.trim().slice(0,20)});
    document.querySelectorAll('.editNum').forEach(el=>{tempItems[el.dataset.type][+el.dataset.idx].amount=Number(el.value)});

  };
  showItems();
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{commit();presetTab=b.dataset.st;renderPresetModal(mode)});
  $('addPreset').onclick=()=>{commit();tempItems[presetTab].push({name:'',amount:5});showItems()};
  $('savePreset').onclick=()=>{
    commit();
    const all=[...tempItems.earn,...tempItems.spend];
    if(all.some(p=>!p.name||!Number.isInteger(p.amount)||p.amount<=0||p.amount>MAX_AMOUNT)){
      $('pErr').textContent='项目名称不能为空，数量必须为 1～'+MAX_AMOUNT+' 的整数';return;
    }
    const c=child();if(!c)return;

    toast(firstRun?'小心愿已准备好啦 ✨':'快捷项目已保存 ✨');

function entry(type){
  const c=child();if(!c)return;
  const isEarn=type==='earn';
  const items=c.quickItems.filter(q=>q.type===type).sort((a,b)=>a.sortOrder-b.sortOrder);
  showModal(`${closeBtn()}
    <h2>${isEarn?'🌟 获得心愿币':'🎁 使用心愿币'}</h2>
    <p>当前余额：<b>${Math.max(0,c.balance).toLocaleString('zh-CN')}</b> ${escapeHTML(c.currencyName)} · 为 <b>${escapeHTML(c.name)}</b> 记录</p>
    <div class="field"><label>数量 *</label><input id="eAmount" type="number" min="1" max="${MAX_AMOUNT}" step="1" inputmode="numeric" placeholder="请输入正整数"></div>
    <div class="field"><label>理由 *</label><input id="eReason" maxlength="100" placeholder="${isEarn?'例如：主动完成作业':'例如：兑换周末看电影'}"></div>
    ${items.length?`<div class="field" style="margin-bottom:4px"><label>⚡ 快速填写</label><span class="hint">点击标签自动填入数量和理由，填完还可以继续修改。</span></div>
    <div class="quickTags">${items.map(q=>`<button type="button" class="quickTag" data-qi="${q.id}">${escapeHTML(q.name)} ${isEarn?'+':'-'}${q.amount}</button>`).join('')}</div>`
    :'<p class="hint" style="margin:6px 0 10px">还没有快捷项目，可直接手动输入；也可以随时在设置里添加常用项目。</p>'}
    <div class="error" id="eErr"></div>
    <button class="primary full" id="eSave">确认${isEarn?'增加':'使用'} ✨</button>`,
    {sheet:true});
  bindFocusScroll(['eAmount','eReason']);
  document.querySelectorAll('[data-qi]').forEach(b=>b.onclick=()=>{
    const q=items.find(x=>x.id===b.dataset.qi);if(!q)return;
    $('eAmount').value=q.amount;$('eReason').value=q.name;$('eErr').textContent='';
    document.querySelectorAll('.quickTag').forEach(x=>x.classList.toggle('sel',x===b));
  });
  $('eSave').onclick=()=>saveEntry(type,c);
}
function saveEntry(type,c){
  if(submitting)return;
  const errEl=$('eErr'),btn=$('eSave'),isEarn=type==='earn';
  const fail=msg=>{errEl.textContent=msg;btn.disabled=false;submitting=false};
  submitting=true;btn.disabled=true;
  const rawVal=Number($('eAmount').value);
  const amount=Math.floor(rawVal);
  const reason=$('eReason').value.trim();
  if(!Number.isFinite(rawVal)||!Number.isInteger(rawVal)||amount<=0){fail('数量必须是大于 0 的整数');return}
  if(amount>MAX_AMOUNT){fail('单次数量不能超过 '+MAX_AMOUNT);return}
  if(!reason){fail('请填写理由');return}
  if(!isEarn&&amount>Math.max(0,c.balance)){fail('心愿币不够啦，当前还剩 '+Math.max(0,c.balance)+' 个');return}
  const tx={id:uid(),childId:c.id,type,amount,reason,operator:'家长',createdAt:Date.now()};
  c.transactions.push(tx);recalcBalance(c);c.updatedAt=Date.now();
  if(!persist()){c.transactions.pop();recalcBalance(c);fail('数据保存失败，请检查存储权限后重试');return}
  if(modalOpts)modalOpts.lock=false;
  closeModal();
  resetToToday();render();
  if(isEarn){
    toast('太棒啦！'+c.name+' 获得 '+amount+' '+c.currencyName+' 🌟');
    flyStarsToJar();
    setTimeout(()=>{renderJar();replayClass($('jarWrap'),'bounce');burst()},620);
  }else{
    toast('已使用 '+amount+' '+c.currencyName+' 🎁');
    renderJar();replayClass($('jarWrap'),'shake');
  }
}

  };
  $('sPresets').onclick=showPresetManager;
  $('sChildren').onclick=showChildren;
}

/* ================= 明细记录页 ================= */
function isLedgerView(){return location.hash==='#/records'&&!!child()}
function showLedger(){
  if(!child())return;
  ledgerTab='earn';ledgerCount=PAGE_SIZE;
  if(location.hash!=='#/records')location.hash='#/records';else drawLedger();
}
function drawLedger(){
  const c=child();if(!c)return;
  $('ledgerSubtitle').textContent=c.name+' 的每一次成长，都值得收藏。';
  document.querySelectorAll('[data-ledger]').forEach(b=>{
    b.classList.toggle('on',b.dataset.ledger===ledgerTab);
    b.onclick=()=>{if(ledgerTab!==b.dataset.ledger){ledgerTab=b.dataset.ledger;ledgerCount=PAGE_SIZE;drawLedger()}};
  });
  const all=c.transactions.filter(t=>t.type===ledgerTab).sort((a,b)=>b.createdAt-a.createdAt);
  const shown=all.slice(0,ledgerCount);
  $('ledgerList').innerHTML=shown.length?shown.map(recHTML).join(''):
    `<div class="emptyText">${ledgerTab==='earn'?'还没有获得记录，快来收集第一颗星星吧！':'还没有使用记录，攒够心愿币就来兑换心仪的奖励吧！'}</div>`;
  $('loadMoreWrap').classList.toggle('none',all.length<=shown.length);
  if(all.length>shown.length)$('loadMore').onclick=()=>{ledgerCount+=PAGE_SIZE;drawLedger()};
  syncPage();
}
function syncPage(){
  const led=isLedgerView();
  document.querySelector('.shell').classList.toggle('none',led);
  document.querySelector('.footerNav').classList.toggle('none',led);
  $('ledgerPage').classList.toggle('none',!led);
  if(led)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(isLedgerView())drawLedger();else syncPage()});

/* ================= 事件绑定与启动 ================= */
$('addBtn').onclick=()=>entry('earn');
$('useBtn').onclick=()=>entry('spend');
$('switchChild').onclick=showChildren;
$('settingsBtn').onclick=showSettings;
$('ledgerBtn').onclick=showLedger;
$('helpBtn').onclick=()=>showIntro(false);
$('backHome').onclick=()=>{location.hash=''};
function gotoMonth(y,m){
  viewYear=y;viewMonth=m;
  const t=new Date();
  selectedDate=(y===t.getFullYear()&&m===t.getMonth())?todayKey():dateKey(new Date(y,m,1));
  renderCalendar();
}
$('prevMonth').onclick=()=>{let m=viewMonth-1,y=viewYear;if(m<0){m=11;y--}gotoMonth(y,m)};
$('nextMonth').onclick=()=>{let m=viewMonth+1,y=viewYear;if(m>11){m=0;y++}gotoMonth(y,m)};

(function init(){
  if(child()){
    render();
    if(location.hash==='#/records')drawLedger();
  }
  if(needsOnboarding())showIntro(true);
  if(storageWarning)toast(storageWarning);
})();
})();
</script>
</body>
